name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  # Dummy, non-production values only — never a real secret in CI
  # (spec/operations: "no production secret is ever present in CI").
  NODE_ENV: test
  DATABASE_URL: postgresql://klei:klei_ci_pw@localhost:5432/klei_ci
  REDIS_URL: redis://localhost:6379
  SESSION_SECRET: ci-only-session-secret-not-a-real-secret-00
  SITE_URL: http://localhost:3000
  NEXT_PUBLIC_SITE_URL: http://localhost:3000
  MAIL_PROVIDER_API_KEY: ci-dummy-key
  MAIL_FROM_ADDRESS: enquiries@kleibridal.com
  MAIL_SENDING_DOMAIN: kleibridal.com
  STUDIO_ENQUIRY_EMAIL: studio@kleibridal.com
  MAIL_DRY_RUN: "true"
  IMAGE_ORIGINALS_PATH: ./.data/images/originals
  IMAGE_CACHE_PATH: ./.data/images/derivatives
  # Asia/Manila is assumed, not client-confirmed (KBS-31 open question 3);
  # it moves together with the deploy window and the lead-time bands.
  STUDIO_TIMEZONE: Asia/Manila
  MAIL_WEBHOOK_SIGNING_SECRET: ci-only-webhook-signing-secret-not-real
  # Deliberately a different inbox from STUDIO_ENQUIRY_EMAIL — alerts and
  # brides' enquiries must never share one.
  ALERT_EMAIL: ci-alerts@example.invalid

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, boundaries, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from package.json "packageManager"; a second one here
      # fails setup with "Multiple versions of pnpm specified".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint (includes the module-boundaries check)
        run: pnpm lint

      - name: Format check
        run: pnpm format --check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --run

      - name: Scoped catalogue public-header check
        run: pnpm ops:catalogue-cache headers

      - name: Replica preflight (fail closed)
        run: |
          sudo install -d -o "$USER" -g "$USER" -m 755 /run/kbs
          sudo chown "$USER":"$USER" /run/kbs
          rm -f /run/kbs/replica-preflight.json
          docker run -d --name kbs-web-preflight --label com.docker.compose.service=kbs-web alpine:3.20 sleep 60
          trap 'docker rm -f kbs-web-preflight >/dev/null 2>&1 || true; rm -f /run/kbs/replica-preflight.json' EXIT
          pnpm ops:catalogue-cache preflight

      - name: Catalogue cache unit regression
        run: pnpm exec vitest run tests/unit/catalogue-cache.test.ts

      # Required: `import "server-only"` in src/config/env.ts is enforced
      # only by the Next bundler, so a client component importing env.ts
      # fails here and nowhere earlier (KBS-6).
      - name: Production build
        run: pnpm build

  integration-tests:
    name: Integration tests (real Postgres + Valkey)
    runs-on: ubuntu-latest
    services:
      # Same image as spec/setup's local docker-compose, so CI and a
      # developer's machine see the same database behaviour.
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: klei
          POSTGRES_PASSWORD: klei_ci_pw
          POSTGRES_DB: klei_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U klei"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      # Sign-in's lockout counters live in Valkey (KBS-11-1).
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from package.json "packageManager" (see the job above).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Required: a missing --conditions=react-server flag (env.ts imports
      # "server-only") fails here rather than on the first deploy.
      - name: Apply migrations
        run: pnpm db:migrate

      - name: Seed vocabulary and settings
        run: pnpm db:seed

      - name: Integration tests
        run: pnpm test:integration

      - name: Catalogue cache integration regression
        run: pnpm exec vitest run tests/integration/gowns/catalogue-cache-invalidation.test.ts

  e2e:
    name: E2E (phone 390 + laptop 1280)
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: klei
          POSTGRES_PASSWORD: klei_ci_pw
          POSTGRES_DB: klei_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U klei"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
      valkey:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd="valkey-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Version comes from package.json "packageManager" (see the first job).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Production build
        run: pnpm build

      # Real-API specs (admin-gowns-real-api) write to Postgres.
      - name: Apply migrations
        run: pnpm db:migrate

      - name: E2E tests
        run: pnpm test:e2e

      - name: Catalogue cache e2e regression
        run: pnpm test:e2e tests/e2e/catalogue-cache.spec.ts

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker-build:
    name: Docker build + container smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-bookworm
        env:
          POSTGRES_USER: klei
          POSTGRES_PASSWORD: klei_ci_pw
          POSTGRES_DB: klei_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U klei -d klei_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    # Verification only: CI never pushes or deploys this image. Dokploy builds
    # the same Dockerfile on the VPS. The job gets no secrets; the build needs
    # none, and the smoke runs on the dummy values in scripts/ci-docker-smoke.sh.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare image manifest database
        env:
          DATABASE_URL: postgresql://klei:klei_ci_pw@localhost:5432/klei_ci
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-only-session-secret-not-a-real-secret-00
          SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          MAIL_PROVIDER_API_KEY: ci-dummy-key
          MAIL_FROM_ADDRESS: enquiries@kleibridal.com
          MAIL_SENDING_DOMAIN: kleibridal.com
          STUDIO_ENQUIRY_EMAIL: studio@kleibridal.com
          MAIL_DRY_RUN: "true"
          IMAGE_ORIGINALS_PATH: /data/media/originals
          IMAGE_CACHE_PATH: /data/media/derivatives
        run: pnpm db:migrate

      # NEXT_PUBLIC_SITE_URL is the only build arg: it is inlined into the
      # client bundle, so Dokploy must set it to the live origin. Here it is
      # deliberately not a real domain.
      - name: Build runtime image
        run: docker build --build-arg NEXT_PUBLIC_SITE_URL=http://localhost:3000 -t kbs-web:ci .

      # The migrate one-off is the builder stage (it has tsx and the SQL files;
      # the runtime image has neither). It reuses the cached layers from above.
      - name: Build migrate image (builder stage)
        run: docker build --target builder -t kbs-migrate:ci .

      - name: Container smoke (config, migrations, two deploys on one volume, missing-var exit)
        run: scripts/ci-docker-smoke.sh kbs-web:ci kbs-migrate:ci

      - name: Image manifest verification
        env:
          DATABASE_URL: postgresql://klei:klei_ci_pw@localhost:5432/klei_ci
          REDIS_URL: redis://localhost:6379
          SESSION_SECRET: ci-only-session-secret-not-a-real-secret-00
          SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          MAIL_PROVIDER_API_KEY: ci-dummy-key
          MAIL_FROM_ADDRESS: enquiries@kleibridal.com
          MAIL_SENDING_DOMAIN: kleibridal.com
          STUDIO_ENQUIRY_EMAIL: studio@kleibridal.com
          MAIL_DRY_RUN: "true"
          IMAGE_ORIGINALS_PATH: /data/media/originals
          IMAGE_CACHE_PATH: /data/media/derivatives
        run: pnpm images:verify

      - name: Replica preflight
        run: |
          sudo install -d -o "$USER" -g "$USER" -m 755 /run/kbs
          sudo chown "$USER":"$USER" /run/kbs
          rm -f /run/kbs/replica-preflight.json
          docker run -d --name kbs-web-preflight --label com.docker.compose.service=kbs-web alpine:3.20 sleep 60
          trap 'docker rm -f kbs-web-preflight >/dev/null 2>&1 || true; rm -f /run/kbs/replica-preflight.json' EXIT
          pnpm ops:catalogue-cache preflight
